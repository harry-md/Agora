info:
  name: Update Manufacturer
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:8080/api/manufacturers/{{manufacturerId}}
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Apple Inc.
      - name: description
        type: text
        value: Updated description
      - name: countryId
        type: text
        value: "{{countryId}}"
      - name: active
        type: text
        value: "true"
  auth: inherit
