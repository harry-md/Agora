info:
  name: Create Manufacturer
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/manufacturers
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Apple
      - name: logo
        type: file
        value:
          - "{{logoPath}}"
        contentType: image/png
      - name: description
        type: text
        value: Apple Inc.
      - name: countryId
        type: text
        value: "{{countryId}}"
  auth: inherit
