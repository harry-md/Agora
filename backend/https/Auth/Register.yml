info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/users
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: user
      - name: password
        type: text
        value: "1"
      - name: fullName
        type: text
        value: ABC
      - name: email
        type: text
        value: user@gmail.com
      - name: avatar
        type: file
        value:
          - /home/harry/Downloads/cat.jpg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
