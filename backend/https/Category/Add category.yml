info:
  name: Add category
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/categories
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: iPhone
      - name: image
        type: file
        value:
          - /home/harry/Downloads/phone.jpg
        contentType: image/jpeg
      - name: parentId
        type: text
        value: 01a1292e-b2fd-781d-b764-df35081dc58c
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
