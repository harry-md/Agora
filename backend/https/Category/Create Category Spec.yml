info:
  name: Create Category Spec
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8080/api/categories/{{categoryId}}/filters
  body:
    type: json
    data: |-
      {
        "specDefinitionId": "{{specDefinitionId}}",
        "required": true,
        "filterable": true,
        "displayOrder": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
